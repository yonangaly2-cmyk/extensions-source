name: Build Arab Toons
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Load only Arab Toons
        run: sed -i 's|^loadAllIndividualExtensions()|loadIndividualExtension("ar", "arabtoons")|' settings.gradle.kts
      - name: Build
        run: ./gradlew :src:ar:arabtoons:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arabtoons-apk
          path: src/ar/arabtoons/build/outputs/apk/**/*.apk
